name: AiUsageTracker
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.3"
settings:
  base:
    SWIFT_VERSION: "6.1"

targets:
  AiUsageTracker:
    type: application
    platform: iOS
    sources:
      - AiUsageTracker
      - AiUsageTrackerShared
    info:
      path: AiUsageTracker/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleWindows: false
          UISceneConfigurations: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.aiusagetracker
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    resources:
      - AiUsageTracker/Assets.xcassets
    entitlements:
      path: AiUsageTracker/AiUsageTracker.entitlements

  AiUsageTrackerWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - AiUsageTrackerWidget
      - AiUsageTrackerShared
    info:
      path: AiUsageTrackerWidget/Info.plist
      properties:
        CFBundleDisplayName: AI Usage
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.aiusagetracker.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    resources:
      - AiUsageTrackerWidget/Assets.xcassets
    entitlements:
      path: AiUsageTrackerWidget/AiUsageTrackerWidget.entitlements

  AiUsageTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AiUsageTrackerTests
    dependencies:
      - target: AiUsageTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AiUsageTracker.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AiUsageTracker"
        BUNDLE_LOADER: "$(TEST_HOST)"
